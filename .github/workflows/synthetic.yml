name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 tests/setup.py
      - run: python3 tools/setup.py --mode full --home /tmp/dsh-ci-preview
      - run: python3 tests/recovery.py
      - run: python3 tests/knowledge-contracts.py
      - run: python3 tests/dynamic-tools.py
      - run: python3 tests/protocol-tools.py
      - run: python3 tests/windows-pwn.py
      - run: python3 tests/local-analysis.py
      - run: python3 tests/relay-evidence.py
      - run: python3 tests/worker-snapshot.py --native-local
      - run: python3 tests/local-lab.py --native-local
      - run: python3 tests/knowledge.py
      - run: node tests/knowledge-package.mjs
      - run: python3 examples/recovery/run.py
      - run: python3 tests/run.py
